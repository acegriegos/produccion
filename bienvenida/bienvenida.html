<form id="correo">
	<div class="row">
		<div class="col-md-2 col-lg-2">
			<p>Digite su correo:</p>
		</div>
		<div class="col-md-3 col-lg-3">
			<input type="text" id="mail" class="form-control" value="" placeholder="Correo del Administrador"><br>
			<div class="alert alert-danger err_" id="err1" style="display: none">
				<strong id="errm1"></strong>
			</div>
		</div>
		<div class="col-md-7 col-lg-7"></div>
	</div>
	<div class="row">
		<div class="col-md-5 col-lg-5">
			<button type="submit" class="btn btn-primary der">Enviar</button>
		</div>
		<div class="col-md-7 col-lg-7"></div>
	</div>
</form>

<form id="licencia" class="inv">
	<div class="row">
		<div class="col-md-5 col-lg-5">
			<div class="alert alert-success suc_" id="suc1" style="display: none">
				<strong id="sucm1"></strong>
			</div>
		</div>
		<div class="col-md-7 col-lg-7"></div>
	</div>
	<div class="row">
		<div class="col-md-2 col-lg-2">
			<p>Código de activación</p>
		</div>
		<div class="col-md-3 col-lg-3">
			<input type="text" id="vlicencia" class="form-control" value="">
		</div>
		<div class="col-md-7 col-lg-7"></div><br><br>
		<div class="col-md-5 col-lg-5">
			<div class="alert alert-danger err_" id="err4" align="center" style="display: none">
				<strong id="errm4"></strong>
			</div>
		</div>
	</div><br>
	
	
	<div class="row">
		<div class="col-md-5 col-lg-5">
			<button type="submit" class="btn btn-primary der">Activar</button>
		</div>
	</div>
</form>

	<p>Su producto ha sido activado con éxito.</p><br>

		    		</div>
		    	</div>
		    	<div class="col-md-6 col-lg-6">
		    		<div class="input-group">
		    			<div class="input-group-addon"><b>Cédula</b></div>
		    			<input type="text" class="form-control infoempresa" id="vcedula" placeholder="Cédula Jurídica" field="Cjuridica">
		    		</div>
		    	</div>
		    </div><br>
		    <div class="row">
		    	<div class="col-md-6 col-lg-6">
		    		<div class="input-group">
		    			<div class="input-group-addon"><b>Teléfono</b></div>
		    			<input type="text" class="form-control infoempresa" id="vtelefono" placeholder="Teléfono de la Empresa" data-mask="9999-9999 || 9999-9999 || 9999-9999" field="telefonos">
		    		</div>
		    	</div>
		    	<div class="col-md-6 col-lg-6">
		    		<div class="input-group">
		    			<div class="input-group-addon"><b>Correo</b></div>
		    			<input type="text" class="form-control infoempresa" id="vcorreo" placeholder="Correo" field="correo">
		    		</div>
		    	</div>
		    </div><br>
		    <div class="row">
		    	<div class="col-md-6 col-lg-6">
		    		<div class="input-group">
		    			<div class="input-group-addon"><b>Dirección</b></div>
		    			<input type="text" id="vdireccion" class="form-control infoempresa" value="" placeholder="Dirección de la empresa" field="direccion">
		    		</div>
		    	</div>
		    	<div class="col-md-6 col-lg-6">
		    		
		    	</div>

		    <div class="alert alert-success suc_" id="suc2" style="display: none">
		    	<strong id="sucm2"></strong>
		    </div>
	  	</div>
	</div>

	<div class="card" id="imp">
	    <h3 class="card-header card-info">Impuestos</h3>
	    <div class="card-block">
	        <div class="row">
	            <div class="col-md-6 col-lg-6">
	                <div class="input-group">
	                    <div class="input-group-addon"><b>Nombre Impuesto</b></div>
	                    <input type="text" class="form-control" id="vimpuesto" placeholder="Nombre del Impuesto">
	                    <div class="input-group-addon btn"><i class="fa fa-plus" id="addimp"></i></div>
	                </div>
	            </div>
	            <div class="col-md-6 col-lg-6"></div>
	        </div><br><br>
	        <div id="dimpuestos"></div><br>
	        <div class="row">
	            <div class="col-md-6 col-lg-6"></div>
	            <div class="col-md-6 col-lg-6">
	                <button type="button" class="btn btn-primary der" id="actinfo">Actualizar</button>
	            </div>
	        </div>
	    </div>
	</div>
